[project]
name = "q6"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "numba<0.63",
    "scipy",
    "statsmodels",
    "lightgbm",
    "pydantic>=2",
    "python-dotenv",
    "baostock",
    "akshare",
    "fastapi",
    "uvicorn",
    "psutil",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff"]
report = ["matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/q6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
# scripts/probe 是 P1-05 实测报告的原始证据脚本，保持原样不做格式化
extend-exclude = ["scripts/probe", "*.ps1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
